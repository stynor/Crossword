<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Иқтисодчӣ — Кроссворд</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1d1f33;--mu:#7b7f99;--ac:#6c5ce7;--ac2:#a29bfe;--cell:#fff;--ln:#d5d8ea;--act:#e6e3ff;--ok:#1e9e6a;--bad:#e5484d;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#14152a;--card:#1f2140;--tx:#eef0ff;--mu:#9a9ec4;--ac:#8c7bff;--ac2:#5b4fd6;--cell:#262a52;--ln:#3a3f73;--act:#35397a;--ok:#3ddc97;--bad:#ff6b70;color-scheme:dark}
:root[data-theme=mint]{--bg:#eaf7f1;--card:#fff;--tx:#17352b;--mu:#6b8f80;--ac:#16a37f;--ac2:#7fd9bd;--cell:#fff;--ln:#c4e5d8;--act:#d3f3e6;--ok:#0e7a5c;--bad:#e5484d;color-scheme:light}
:root[data-theme=sunset]{--bg:#fff3e8;--card:#fff;--tx:#3a2316;--mu:#a1826c;--ac:#f0642d;--ac2:#ffb48a;--cell:#fff;--ln:#f1d6c2;--act:#ffe2cc;--ok:#1e9e6a;--bad:#d7263d;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:520px;margin:0 auto;padding:12px 14px 90px}
.top{display:flex;align-items:center;gap:8px;justify-content:space-between}
h1{font-size:19px;margin:0}
.row{display:flex;gap:6px;align-items:center}
button{font:inherit;border:0;border-radius:12px;background:var(--card);color:var(--tx);padding:8px 11px;cursor:pointer;box-shadow:0 1px 3px #0002}
button:active{transform:scale(.95)}
button.on{background:var(--ac);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;margin:12px 0}
.chips button{white-space:nowrap}
.card{background:var(--card);border-radius:16px;padding:12px;margin:10px 0;box-shadow:0 2px 8px #0001}
.grid{display:grid;gap:2px;justify-content:center;margin:0 auto}
.cell{position:relative;background:var(--cell);border:1.5px solid var(--ln);border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;user-select:none}
.cell.act{background:var(--act)}
.cell.sel{background:var(--ac);color:#fff}
.cell.hint{color:var(--ok)}
.cell.bad{color:var(--bad);animation:sh .3s}
.cell b{position:absolute;top:1px;left:2px;font-size:8px;font-weight:600;opacity:.7}
@keyframes sh{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.clue{font-size:15px;min-height:40px;display:flex;align-items:center;gap:8px}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.tools button{padding:11px 4px;font-size:14px}
.cl{font-size:14px;line-height:1.7}
.cl div{padding:3px 6px;border-radius:8px;cursor:pointer}
.cl div.a{background:var(--act)}
.cl h3{margin:8px 0 2px;font-size:13px;color:var(--mu);text-transform:uppercase}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);box-shadow:0 -2px 10px #0002}
.tabs button{flex:1;max-width:220px;box-shadow:none;background:var(--bg)}
.av{font-size:56px;text-align:center}
.avs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.avs button{font-size:22px;padding:6px 9px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--bg);border-radius:12px;padding:10px 4px}
.stats b{display:block;font-size:20px}
.stats small{color:var(--mu)}
input.nm{width:100%;font:inherit;font-size:17px;text-align:center;padding:10px;border-radius:12px;border:1.5px solid var(--ln);background:var(--cell);color:var(--tx);margin:8px 0}
.bar{height:8px;background:var(--bg);border-radius:8px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac))}
#hid{position:fixed;left:-100px;top:0;width:10px;height:10px;opacity:0;font-size:16px}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:9;padding:20px}
.ov .card{text-align:center;max-width:320px;width:100%}
.ov h2{margin:4px 0}
.cf{position:fixed;top:-30px;font-size:24px;z-index:10;animation:fall 2.6s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style></head><body>
<div id="app"></div>
<input id="hid" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false">
<script>
const $=s=>document.querySelector(s);
const TH=['light','dark','mint','sunset'],AV=['🦉','🦊','🐼','🦁','🐯','🐸','🚀','🧠'];
let P={name:'',av:'🦉',score:0,solved:0,lang:'ru',theme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light',topic:'micro'};
try{Object.assign(P,JSON.parse(localStorage.getItem('xw')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('xw',JSON.stringify(P))}catch(e){}};
const parse=s=>s.split(';').map(x=>x.split('|'));
const D={
micro:{
ru:parse("СПРОС|Желание и возможность купить;ПРЕДЛОЖЕНИЕ|Товары, которые готовы продать;ЦЕНА|Денежное выражение стоимости;РЫНОК|Место встречи продавцов и покупателей;ТОВАР|Продукт для обмена;ПРИБЫЛЬ|Доход минус затраты;МОНОПОЛИЯ|Один продавец на рынке;КОНКУРЕНЦИЯ|Соперничество фирм"),
tg:parse("ТАЛАБОТ|Хоҳиш ва қобилият барои харид;ТАКЛИФ|Молҳои барои фурӯш омода;НАРХ|Арзиши пулии мол;БОЗОР|Ҷои вохӯрии фурӯшанда ва харидор;МОЛ|Маҳсулот барои мубодила;ФОИДА|Даромад минус хароҷот;МОНОПОЛИЯ|Як фурӯшанда дар бозор;РАҚОБАТ|Ҳамлаи корхонаҳо барои бозор"),
en:parse("DEMAND|Willingness and ability to buy;SUPPLY|Goods sellers offer;PRICE|Money value of a good;MARKET|Where buyers meet sellers;GOODS|Products made for exchange;PROFIT|Revenue minus costs;MONOPOLY|Only one seller;COMPETITION|Rivalry between firms")},
macro:{
ru:parse("ИНФЛЯЦИЯ|Рост общего уровня цен;НАЛОГ|Обязательный платёж государству;БЮДЖЕТ|План доходов и расходов страны;ЭКСПОРТ|Вывоз товаров за границу;ИМПОРТ|Ввоз товаров из-за границы;БЕЗРАБОТИЦА|Нет работы у желающих трудиться;ПОШЛИНА|Сбор при пересечении границы;КРИЗИС|Резкий спад экономики"),
tg:parse("ТАВАРРУМ|Болоравии сатҳи нархҳо;МОЛИЯТ|Пардохти ҳатмӣ ба давлат;БУҶЕТ|Нақшаи даромад ва харҷи давлат;СОДИРОТ|Бурдани мол ба хориҷ;ВОРИДОТ|Овардани мол аз хориҷ;БЕКОРӢ|Набудани кор барои корҷӯён;ГУМРУК|Боҷ ҳангоми убури марз;БУҲРОН|Таназзули якбораи иқтисод"),
en:parse("INFLATION|General rise in prices;TAX|Mandatory payment to the state;BUDGET|Plan of state income and spending;EXPORT|Selling goods abroad;IMPORT|Buying goods from abroad;CRISIS|Sharp economic downturn;TARIFF|Tax on imported goods;GROWTH|Rise in national output")},
money:{
ru:parse("ДЕНЬГИ|Всеобщий эквивалент стоимости;БАНК|Хранит вклады и выдаёт кредиты;КРЕДИТ|Деньги в долг;ПРОЦЕНТ|Плата за пользование кредитом;ВАЛЮТА|Денежная единица страны;АКЦИЯ|Доля в капитале компании;ВКЛАД|Деньги, положенные в банк;КУРС|Цена одной валюты в другой"),
tg:parse("ПУЛ|Баробари умумии арзиш;БОНК|Амонат мегирад, қарз медиҳад;ҚАРЗ|Пул барои муддати муайян;ФОИЗ|Пардохт барои истифодаи қарз;САҲМ|Ҳиссаи сармояи ширкат;АМОНАТ|Пули ба бонк гузошташуда;ҚУРБ|Нархи як асъор бар асъори дигар;СОМОНӢ|Воҳиди пули Тоҷикистон"),
en:parse("MONEY|Universal measure of value;BANK|Keeps deposits, gives loans;CREDIT|Money borrowed;INTEREST|Price of using a loan;CURRENCY|A country's money unit;SHARE|Part ownership of a company;DEPOSIT|Money placed in a bank;RATE|Price of one currency in another")}};
const T={
ru:{t:"Кроссворд-экономист",play:"Игра",prof:"Профиль",hint:"Подсказка",chk:"Проверить",new:"Новая",ac:"По горизонтали",dn:"По вертикали",micro:"Микро",macro:"Макро",money:"Деньги",win:"Победа! Ты настоящий экономист!",pts:"очков",again:"Играть ещё",name:"Твоё имя",nmph:"Введи имя",solved:"Решено",score:"Очки",lv:"Уровень",lvs:["Студент","Бакалавр","Магистр","Профессор"],tap:"Нажми на клетку"},
tg:{t:"Кроссворди иқтисодчӣ",play:"Бозӣ",prof:"Профил",hint:"Маслиҳат",chk:"Санҷиш",new:"Нав",ac:"Уфуқӣ",dn:"Амудӣ",micro:"Микро",macro:"Макро",money:"Пул",win:"Ғалаба! Ту иқтисодчии аслӣ!",pts:"хол",again:"Боз бозӣ",name:"Номи ту",nmph:"Номро ворид кун",solved:"Ҳал шуд",score:"Хол",lv:"Дараҷа",lvs:["Донишҷӯ","Бакалавр","Магистр","Профессор"],tap:"Ба katak пахш кун"},
en:{t:"Economist Crossword",play:"Play",prof:"Profile",hint:"Hint",chk:"Check",new:"New",ac:"Across",dn:"Down",micro:"Micro",macro:"Macro",money:"Money",win:"You win! A true economist!",pts:"pts",again:"Play again",name:"Your name",nmph:"Enter name",solved:"Solved",score:"Score",lv:"Level",lvs:["Student","Bachelor","Master","Professor"],tap:"Tap a cell"}};
T.tg.tap="Ба хона пахш кун";
const NZ={Ӣ:'И',Ӯ:'У',Қ:'К',Ҳ:'Х',Ҷ:'Ч',Ғ:'Г'};
const nz=s=>s.toUpperCase().replace(/[ӢӮҚҲҶҒ]/g,m=>NZ[m]);
let puz,ent,hint,hints,t0,sel,chk,tab='play',won=false;
const key=(r,c)=>r+','+c;

function gen(words){
  let best=null;
  for(let t=0;t<120;t++){
    const ws=[...words].sort(()=>Math.random()-.5);
    ws.sort((a,b)=>b[0].length-a[0].length);
    const g={},pl=[];
    const can=(w,r,c,d)=>{const dr=d,dc=1-d;let x=0;
      if(g[key(r-dr,c-dc)]||g[key(r+dr*w.length,c+dc*w.length)])return 0;
      for(let i=0;i<w.length;i++){const R=r+dr*i,C=c+dc*i,q=g[key(R,C)];
        if(q){if(q.ch!==w[i]||q.d[d])return 0;x++}
        else if(g[key(R+dc,C+dr)]||g[key(R-dc,C-dr)])return 0}
      return x};
    const put=(w,cl,r,c,d)=>{for(let i=0;i<w.length;i++){const k=key(r+d*i,c+(1-d)*i);(g[k]=g[k]||{ch:w[i],d:{}}).d[d]=1}pl.push({w,cl,r,c,d})};
    put(ws[0][0],ws[0][1],20,20-(ws[0][0].length>>1),0);
    for(const [w,cl] of ws.slice(1)){
      const cand=[];
      for(const k in g){const [R,C]=k.split(',').map(Number);
        for(let i=0;i<w.length;i++)if(w[i]===g[k].ch)for(const d of[0,1]){
          const r=R-d*i,c=C-(1-d)*i;if(can(w,r,c,d)===1)cand.push([r,c,d])}}
      if(cand.length){const [r,c,d]=cand[Math.random()*cand.length|0];put(w,cl,r,c,d)}
    }
    if(!best||pl.length>best.length)best=pl;
    if(pl.length===words.length)break;
  }
  const r0=Math.min(...best.map(x=>x.r)),c0=Math.min(...best.map(x=>x.c));
  let rows=0,cols=0;const cells={};
  best.forEach(x=>{x.r-=r0;x.c-=c0;for(let i=0;i<x.w.length;i++){const r=x.r+x.d*i,c=x.c+(1-x.d)*i;cells[key(r,c)]=x.w[i];rows=Math.max(rows,r+1);cols=Math.max(cols,c+1)}});
  const starts={};let n=0;
  [...best].sort((a,b)=>a.r-b.r||a.c-b.c).forEach(x=>{const k=key(x.r,x.c);if(!starts[k])starts[k]=++n;x.n=starts[k]});
  return{words:best,rows,cols,cells,starts};
}
const has=(x,r,c)=>x.d?(c===x.c&&r>=x.r&&r<x.r+x.w.length):(r===x.r&&c>=x.c&&c<x.c+x.w.length);
const aw=()=>puz.words.find(x=>x.d===sel.d&&has(x,sel.r,sel.c))||puz.words.find(x=>has(x,sel.r,sel.c));
function newGame(){
  puz=gen(D[P.topic][P.lang]);ent={};hint={};hints=0;t0=Date.now();chk=false;won=false;
  const f=[...puz.words].sort((a,b)=>a.n-b.n)[0];sel={r:f.r,c:f.c,d:f.d};
}
function tap(r,c){
  if(sel.r===r&&sel.c===c){const o=puz.words.find(x=>x.d!==sel.d&&has(x,r,c));if(o)sel.d=o.d}
  else{sel.r=r;sel.c=c;if(!puz.words.find(x=>x.d===sel.d&&has(x,r,c)))sel.d=1-sel.d}
  $('#hid').focus();draw();
}
function typeCh(ch){
  const a=aw();if(!a||won)return;
  ent[key(sel.r,sel.c)]=ch.toUpperCase();chk=false;
  const nr=sel.r+a.d,nc=sel.c+(1-a.d);if(has(a,nr,nc)){sel.r=nr;sel.c=nc}
  draw();checkWin();
}
function back(){
  const a=aw();if(!a)return;const k=key(sel.r,sel.c);
  if(ent[k]&&!hint[k])delete ent[k];
  else{const pr=sel.r-a.d,pc=sel.c-(1-a.d);if(has(a,pr,pc)){sel.r=pr;sel.c=pc;if(!hint[key(pr,pc)])delete ent[key(pr,pc)]}}
  chk=false;draw();
}
function doHint(){
  const a=aw();if(!a||won)return;hints++;
  for(let i=0;i<a.w.length;i++){const k=key(a.r+a.d*i,a.c+(1-a.d)*i);ent[k]=a.w[i];hint[k]=1}
  draw();checkWin();
}
function checkWin(){
  if(won)return;
  if(Object.keys(puz.cells).every(k=>ent[k]&&nz(ent[k])===nz(puz.cells[k]))){
    won=true;const g=Math.max(20,100-hints*15);P.score+=g;P.solved++;save();
    if(navigator.vibrate)try{navigator.vibrate(200)}catch(e){}
    draw();confetti();
    const o=document.createElement('div');o.className='ov';o.id='ov';
    o.innerHTML=`<div class="card"><div style="font-size:54px">🏆</div><h2>${T[P.lang].win}</h2><p>+${g} ${T[P.lang].pts}</p><button class="on" id="ag">${T[P.lang].again}</button></div>`;
    document.body.appendChild(o);$('#ag').onclick=()=>{o.remove();newGame();draw()};
  }
}
function confetti(){const e=['🎉','💰','📈','⭐','🪙','✨'];for(let i=0;i<36;i++){const s=document.createElement('span');s.className='cf';s.textContent=e[i%6];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3600)}}
function draw(){
  const L=T[P.lang];document.documentElement.dataset.theme=P.theme;document.documentElement.lang=P.lang==='tg'?'tg':P.lang;
  let h=`<div class="top"><h1>🧩 ${L.t}</h1><div class="row"><button id="th">🎨</button></div></div>
  <div class="row" style="margin-top:10px">${['tg','ru','en'].map(l=>`<button data-l="${l}" class="${P.lang===l?'on':''}">${{tg:'🇹🇯 TJ',ru:'🇷🇺 RU',en:'🇬🇧 EN'}[l]}</button>`).join('')}</div>`;
  if(tab==='play'){
    h+=`<div class="chips">${['micro','macro','money'].map(t=>`<button data-t="${t}" class="${P.topic===t?'on':''}">${{micro:'📊',macro:'🌍',money:'💰'}[t]} ${L[t]}</button>`).join('')}</div>`;
    const s=Math.min(40,Math.floor((Math.min(innerWidth,520)-40)/puz.cols)),a=aw();
    h+=`<div class="card"><div class="grid" style="grid-template-columns:repeat(${puz.cols},${s}px)">`;
    for(let r=0;r<puz.rows;r++)for(let c=0;c<puz.cols;c++){
      const k=key(r,c),ch=puz.cells[k];if(!ch){h+=`<i style="width:${s}px;height:${s}px"></i>`;continue}
      const v=ent[k]||'',ok=v&&nz(v)===nz(ch);
      const cl='cell'+(sel.r===r&&sel.c===c?' sel':a&&has(a,r,c)?' act':'')+(chk&&v&&!ok?' bad':'')+(hint[k]?' hint':'');
      h+=`<div class="${cl}" data-r="${r}" data-c="${c}" style="width:${s}px;height:${s}px;font-size:${s*.55}px">${puz.starts[k]?`<b>${puz.starts[k]}</b>`:''}${ok?ch:v}</div>`}
    h+=`</div><div class="clue"><span>${a&&a.d?'⬇️':'➡️'}</span><span>${a?`<b>${a.n}.</b> ${a.cl}`:L.tap}</span><span style="margin-left:auto;color:var(--mu)" id="tm"></span></div>
    <div class="tools"><button id="bh">💡 ${L.hint}</button><button id="bc">✅ ${L.chk}</button><button id="bb">⌫</button><button id="bn">🔄 ${L.new}</button></div></div>`;
    h+=`<div class="card cl">`;
    for(const d of[0,1]){h+=`<h3>${d?L.dn:L.ac}</h3>`;puz.words.filter(x=>x.d===d).sort((x,y)=>x.n-y.n).forEach(x=>{h+=`<div data-r="${x.r}" data-c="${x.c}" data-d="${d}" class="${a===x?'a':''}"><b>${x.n}.</b> ${x.cl}</div>`})}
    h+=`</div>`;
  }else{
    const lv=Math.min(3,Math.floor(P.score/150)),pr=lv===3?100:(P.score%150)/1.5;
    h+=`<div class="card"><div class="av">${P.av}</div><input class="nm" id="nm" maxlength="16" placeholder="${L.nmph}" value="${P.name.replace(/"/g,'')}">
    <div class="avs">${AV.map(a=>`<button data-a="${a}" class="${P.av===a?'on':''}">${a}</button>`).join('')}</div></div>
    <div class="card"><div class="stats"><div><b>${P.solved}</b><small>${L.solved}</small></div><div><b>${P.score}</b><small>${L.score}</small></div><div><b>${lv+1}</b><small>${L.lv}</small></div></div>
    <p style="text-align:center;margin:12px 0 0">🎓 ${L.lvs[lv]}</p><div class="bar"><i style="width:${pr}%"></i></div></div>`;
  }
  h+=`<div class="tabs"><button data-tab="play" class="${tab==='play'?'on':''}">🎮 ${L.play}</button><button data-tab="prof" class="${tab==='prof'?'on':''}">${P.av} ${L.prof}</button></div>`;
  $('#app').innerHTML=h;tick();
}
function tick(){const e=$('#tm');if(e&&!won){const s=(Date.now()-t0)/1000|0;e.textContent='⏱ '+(s/60|0)+':'+String(s%60).padStart(2,'0')}}
setInterval(tick,1000);
$('#app').addEventListener('click',e=>{
  const t=e.target.closest('button,.cell,.cl div');if(!t)return;const D_=t.dataset;
  if(t.id==='th'){P.theme=TH[(TH.indexOf(P.theme)+1)%4]}
  else if(D_.l){P.lang=D_.l;newGame()}
  else if(D_.t){P.topic=D_.t;newGame()}
  else if(D_.tab){tab=D_.tab}
  else if(D_.a){P.av=D_.a}
  else if(t.id==='bh'){doHint();return}
  else if(t.id==='bc'){chk=true}
  else if(t.id==='bb'){back();return}
  else if(t.id==='bn'){newGame()}
  else if(t.classList.contains('cell')||D_.d!==undefined){
    if(D_.d!==undefined)sel={r:+D_.r,c:+D_.c,d:+D_.d};else{tap(+D_.r,+D_.c);return}
    $('#hid').focus()}
  save();draw();
});
$('#app').addEventListener('input',e=>{if(e.target.id==='nm'){P.name=e.target.value;save()}});
$('#hid').addEventListener('input',e=>{const v=e.target.value;e.target.value='';const ch=[...v].pop();if(ch&&/\p{L}/u.test(ch))typeCh(ch)});
